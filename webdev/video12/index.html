<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>Pure HTML Media Player</title>
</head>
<body>
    <header>
        6 Videos And Audios
    </header>
    <main>
        <video src="1.mp4" controls loop muted>Video-1</video>
        <video src="2.mp4" controls loop muted>Video-2</video>
        <video src="3.mp4" controls loop muted>Video-3</video>
        <video src="4.mp4" controls loop muted>Video-4</video>
        <video src="5.mp4" controls loop muted>Video-5</video>
        <video src="6.mp4" controls loop muted>Video-6</video>
        <h2>AUDIOS

        </h2>
        <audio src="1.mp3"controls>Audio-1</audio>
        <audio src="2.mp3"controls>Audio-2</audio>
        <audio src="3.mp3"controls>Audio-3</audio>
        <audio src="4.mp3"controls>Audio-4</audio>
        <audio src="5.mp3"controls>Audio-5</audio>
        <audio src="6.mp3"controls>Audio-6</audio>
    </main>
    <footer>Visit Our Channel At:
        <a href="https://www.youtube.com">Youtube</a>
    </footer>

</body>
</html>

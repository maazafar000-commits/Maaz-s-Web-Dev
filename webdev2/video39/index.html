<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
.container{
    width:  80vw;
border: 2px solid yellow;
display: grid;
/*grid-template-columns:[pehla] 120px [doosra] 100px [teesra];
grid-template-rows: 100px 100px 100px;*/
grid-template-columns: repeat(4,minmax(100px, 1fr));
gap: 34px;
row-gap: 10px;
column-gap: 44px;
height: 100vh;
justify-items: center;
align-items: center;
place-content: center;

}

.items{
border: 2px solid red;
height: 55px;
width: 55px;

}
.item4{
    grid-row:1/2 ;
    grid-column:pehla/teesra ;
}
.item1{
    grid-row:1/2 ;
    grid-row-start: 1;
    grid-row-end: 2;
    grid-column:1/2 ;
}
.item2{
    align-self: start;
    justify-self: end;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="items item1">1</div>
        <div class="items item2">2</div>
        <div class="items">3</div>
        <div class="items item4">4</div>
        <div class="items">5</div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
.border {
    height: auto; /* Let it fit the image */
    width: auto;
    outline: 2px solid rgb(159, 157, 157);
    outline-offset: 0; /* Touch the image */
    border-radius: 34px;
    margin-left: 35vw;
    display: inline-block; /* Shrinks to fit content */
}

.img {
    border: 2px solid rgb(159, 157, 157); /* Border directly on image */
    display: block;
    border-radius: 34px; /* Match container radius */
}
</style>
</head>
<body>

<div class="border">
    <img class="img" src="https://via.placeholder.com/300" alt="Example Image">
</div>

</body>
</html>

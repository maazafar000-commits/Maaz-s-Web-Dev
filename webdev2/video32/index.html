<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 Solution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            
        }

        .body {
            background-color: grey;
            padding: 45px;
        }

        .card {
            background-color: white;
            width: 194px;
            border-radius: 7px;
            height: 344px;

        }

        .image {
            padding: 5px;

        }

        .image img {
            border-radius: 7px;
        }

        .content {
            padding: 5px 13px;
        }

        .content p {
            font-size: 9px;
            color:gray;
        }

        .capsule {
            padding: 0 28px 0 14px;
        }

        .capsule span {
            border: 1px solid grey;
            padding: 0 6px;
            border-radius: 7px;
            font-size: 8px;
        }
        .button{
            text-align: center;
        }
        .button button{
            padding: 7px 9px;
            border-radius: 15px;
            background-color: rgb(70, 160, 255);
            color: blue;
            font-size: 8px;
            border: none;
            margin: top 7px; ;
            font-weight: bold;
           
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img width="188" src="download (2).jfif" alt="">
            <div class="capsule">
                <span>Nature</span>
                <span>Lake</span>
            </div>
            <div class="content">
                <h2>Harry</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ullam delectus earum vitae accusantium illo
                    maiores tempore labore temporibus dignissimos laborum, iure inventore quisquam?</p>
            </div>
        </div>
        <div class="button">
            <button>Submit</button>
        </div>
    </div>
</body>

</html>

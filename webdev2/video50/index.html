<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filters</title>
    <style>
img{
    filter: blur(10px);
}
.img1{
    filter: brightness(122%);
}
.img2{
    filter: grayscale(20%);
}
    </style>
</head>
<body>
    <div class="container">
        <img src="download (2).jfif" alt="" class="img1">
        <img src="download (2).jfif" alt="" class="img2">
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Property</title>
    <style>
        .box {
            height: 433px;
            width: 80vw;
            margin: 3px;
            border: 2px solid black
        }

        .box1 {
            background-color: aqua;
            position: absolute;
            z-index: 1;
            top: 0px;
            left: 3px;
        }

        .box2 {
            background-color: azure;
            position: relative;
            top: 25px;

            left: 34px;
        }

        .box3 {
            background-color: antiquewhite;
            position: fixed;
            top: 0px;
            left: 25vw;
            
        }

        .box4 {
            background-color: purple;
            position: sticky;
            top: 0px;
            height: 111px;
            width: 100%;
        }
        .parent{
            padding: 43px;
            margin: 34px;
            border: 2px solid purple;
            position: absolute;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"> </div>
        <div class="box box2"> </div>
        <div class="box box3"> </div>
        <div class="box box4"> </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 7</title>
    <style>
        header {
            display: flex;
            margin-left: 30%;
        }

        .container {
            display: grid;
            justify-content: center;
            align-items: center;
            grid-template-columns:repeat(3,1fr) ;
            gap: 40px 15px;
            margin: 0   auto;
            padding: 20px;
            
        }
        .item{
            background-color: rgba(0, 0, 0, 0.15); 
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <header>Download UltraEdit</header>
    <div class="container">
        <div class="item 1">English</div>
        <div class="item 2">Deutsch</div>
        <div class="item 3">Italiano</div>
        <div class="item 4">Espanol</div>
        <div class="item 5">Francais</div>
        <div class="item 6">Portugese</div>
        <div class="item 7">Japanese</div>
        <div class="item 8">Korean</div>
        <div class="item 9">Chinese</div>
    </div>
</body>

</html>

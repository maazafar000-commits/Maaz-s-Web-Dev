<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows And Outlines</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px #20d716 inset;
        }
        .text-shadow{
            text-shadow: 2px 2px 4px #550f0f;
            outline: 2px solid black;
            outline-offset: 10px;
            border-radius: 34px;
        }

    </style>
</head>
<body>
    <div class="box">
        box
    </div>
    <p class="text-shadow">
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. In enim, vitae cum ea, deserunt quam ex consectetur ipsam eum et eligendi facilis blanditiis, eaque provident maxime totam modi reiciendis inventore quae exercitationem atque minus.
    </p>
</body>
</html>

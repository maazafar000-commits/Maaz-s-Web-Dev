<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .navbar ul li{
            list-style: none;
            display: inline;
            margin-left: 100px;
            
        }
        .navbar{
            font-size: x-large;
            background-color: purple;
            color: rgb(255, 255, 255);
            
        }
        .div1{
            background-color: green;
            height: 300px;
            border-radius: 20px;
        }
        .box1{
            border: 2px solid white;
            background-color:  pink;
            height: 180px;
            width: 250px;
            margin-left: 300px;
            padding: 10px;
            position: absolute;
            top: 10%;
            left: 40%;
           
        }
    .box2{
         border: 2px solid white;
            background-color:  red;
            height: 180px;
            width: 250px;
            margin-right: 300px;
            padding: 10px;
            position: absolute;
            top: 10%;
            left: 20%;
    }
    

    </style>
</head>
<body>
    <nav class="navbar">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact Us</li>
        </ul>
    </nav>
    <div class="div1">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>
    
</body>
</html>

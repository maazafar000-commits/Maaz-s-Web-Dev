<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container {
            border: 2px solid red;
            display: flex;
            height: 80vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: center;
            flex-flow: column wrap;
            gap: 10px 30px;
            column-gap: ;
        }

        .item {
            flex-grow: 1;
            height: 32px;
            width: 32px;
            background-color: blueviolet;
            border: 2px solid black;

        }
        .order1{
            order: 1;
        }
        .order2{
            order: 2;
        }
        .order3{
            order: 3;
        }
        .item1{
            flex-grow: 2;
            flex-shrink: 2;
            align-self: flex-end;
        }
    </style>
</head>

<body>
    <main>
        <div class="container">
            <div class="item1 order1 item"></div>
            <div class="order2 item"></div>
            <div class="order3 item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
    </main>
</body>

</html>

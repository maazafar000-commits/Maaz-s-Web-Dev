<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        :root{
            --color: blue;
            --seccolor: red;
            --tricolor: green;
            --defpad: 23px;

        }
        .navbar{
            color: var(--color);
            padding: var(--defpad);
        }
        .no2{
            color: var(--seccolor);
        }
        .no3{
            color: var(--tricolor);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <ul>
            <li class="no1">Home</li>
            <li class="no2">About</li>
            <li class="no3">Contact</li>
        </ul>
    </nav>
</body>
</html>
